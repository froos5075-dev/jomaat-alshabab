<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10152d">
<title>جمعة الشباب</title>
<style>
:root{color-scheme:dark;--line:#2a365d;--blue:#4f8cff;--purple:#9b6bff;--green:#39d6a0;--text:#f4f6ff;--muted:#aab5d4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202650,#0b1022 60%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh}
main{width:min(760px,100%);margin:auto;padding:22px 14px 40px}.top,.gate{text-align:center}.top{padding:20px 0}.logo{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:20px;background:linear-gradient(135deg,var(--purple),var(--blue));font-size:30px}h1{font-size:clamp(28px,7vw,42px);margin:12px 0 5px}p{color:var(--muted);line-height:1.7}.panel{background:#131a32;border:1px solid var(--line);border-radius:20px;padding:17px;margin:14px 0}.gate{max-width:430px;margin:9vh auto}.games{display:grid;grid-template-columns:1fr 1fr;gap:9px}.game{background:#192342;border:1px solid var(--line);border-radius:15px;padding:14px;text-align:right;color:white;min-height:96px;font:inherit;cursor:pointer}.game.active{border-color:var(--purple);background:#28224c}.game b{display:block;margin:7px 0}.game small{color:var(--muted)}label{display:block;font-size:13px;color:#c5cdea;margin:12px 0 6px}input,select{width:100%;border:1px solid #34416c;background:#0e1530;color:white;border-radius:12px;padding:13px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{width:100%;border:0;border-radius:13px;padding:14px;font:inherit;font-weight:700;cursor:pointer;color:white;background:linear-gradient(100deg,var(--purple),var(--blue));margin-top:12px;touch-action:manipulation}.secondary{background:#273353;border:1px solid #3b4972}.hidden{display:none!important}.score{display:flex;gap:8px}.score div{flex:1;background:#0d142b;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.score strong{display:block;font-size:24px}.question{font-size:clamp(20px,5vw,27px);font-weight:750;line-height:1.6;margin:18px 0}.choice{display:block;width:100%;text-align:right;background:#1b2747;border:1px solid #34416c;border-radius:12px;padding:13px;margin:8px 0;color:white;font:inherit;cursor:pointer;touch-action:manipulation}.correct{border-color:var(--green);background:#143b37}.wrong{border-color:#ff6d85;background:#472333}.note,.error{font-size:12px;color:var(--muted);text-align:center}.error{color:#ff8ca0;min-height:22px}.status{font-size:13px;color:#b9f6db;min-height:20px}@media(max-width:420px){.row{grid-template-columns:1fr}}
</style></head><body><main>
<section id="app"><header class="top"><div class="logo">🎮</div><h1>جمعة الشباب</h1><p>اختاروا اللعبة وابدؤوا التحدي</p></header>
<section class="panel"><h2>١. اختاروا اللعبة</h2><div class="games"><button class="game active" data-game="brain" type="button">🧠<b>مخمخ وذكاء</b><small>أسئلة بين فريقين</small></button><button class="game" data-game="riddles" type="button">🧩<b>فوازير</b><small>فكر قبل تجاوب</small></button><button class="game" data-game="speed" type="button">⚡<b>تحدي السرعة</b><small>جاوب بسرعة</small></button><button class="game" data-game="impostor" type="button">🕵️<b>المحتال</b><small>اكتشف المختلف</small></button></div></section>
<section class="panel" id="setup"><h2>٢. إعداد الجولة</h2><div class="row"><div><label>اسم الفريق الأحمر</label><input id="redName" value="الفريق الأحمر"></div><div><label>اسم الفريق الأزرق</label><input id="blueName" value="الفريق الأزرق"></div></div><label>عدد الأسئلة</label><select id="count"><option>5</option><option>10</option><option>15</option><option>20</option></select><label>أسماء اللاعبين (للمحتال، افصل الأسماء بفواصل)</label><input id="players" placeholder="فارس، خالد، نواف، محمد"><button class="btn" id="start" type="button">ابدأ الجولة</button><p id="hint">كل إجابة صحيحة = نقطة واحدة.</p></section>
<section class="panel hidden" id="play"><div class="score"><div><span id="rLabel">الفريق الأحمر</span><strong id="rScore">0</strong></div><div><span id="bLabel">الفريق الأزرق</span><strong id="bScore">0</strong></div></div><p id="progress"></p><div class="question" id="question"></div><div id="answers"></div><p id="feedback"></p><button class="btn hidden" id="next" type="button">السؤال التالي</button><button class="btn secondary" id="restart" type="button">إنهاء الجولة</button></section><p class="note">نسخة أولية: اختبروا الوظائف والأسئلة قبل النشر العام.</p></section></main>
<script>
(function(){
const $=id=>document.getElementById(id);
let game="brain",idx=0,red=0,blue=0,turn=0,round=[];
const banks={brain:[["كم عدد أضلاع الشكل السداسي؟",["5","6","7","8"],1],["ما الكوكب المعروف بالكوكب الأحمر؟",["الزهرة","المريخ","عطارد","زحل"],1],["كم دقيقة في ساعتين ونصف؟",["120","130","150","180"],2],["ما عاصمة اليابان؟",["سيول","بكين","طوكيو","بانكوك"],2],["ما ناتج 9 × 7؟",["56","63","72","69"],1],["أي حيوان يُعرف بسفينة الصحراء؟",["الحصان","الجمل","اللاما","الفيل"],1],["كم يومًا في السنة الكبيسة؟",["364","365","366","367"],2],["ما أكبر محيط في العالم؟",["الأطلسي","الهندي","الهادئ","المتجمد"],2]],riddles:[["شيء كلما أخذت منه كبر، ما هو؟",["الحفرة","العمر","البحر","الظل"],0],["له أسنان ولا يعض، ما هو؟",["الكلب","المشط","المنشار","المفتاح"],1],["ما الشيء الذي يكتب ولا يقرأ؟",["القلم","الكتاب","الطالب","الحاسوب"],0],["يمشي بلا أرجل ويبكي بلا عيون، ما هو؟",["السحاب","الريح","النهر","الوقت"],0],["ما الشيء الذي له عين ولا يرى؟",["الإبرة","الكاميرا","الإعصار","الإنسان"],0]],speed:[["كم شهرًا في السنة؟",["10","11","12","13"],2],["ما عكس كلمة سريع؟",["قوي","بطيء","بعيد","خفيف"],1],["كم ثانية في الدقيقة؟",["30","50","60","100"],2],["ما ناتج 12 + 19؟",["29","30","31","32"],2]]};
document.querySelectorAll(".game").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".game").forEach(x=>x.classList.remove("active"));b.classList.add("active");game=b.dataset.game;$("hint").textContent=game==="impostor"?"أدخل 3 أسماء على الأقل؛ مرروا الجهاز لكل لاعب بسرية.":"كل إجابة صحيحة = نقطة واحدة.";}));
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
$("start").addEventListener("click",()=>{if(game==="impostor"){let names=$("players").value.split(/[،,]/).map(x=>x.trim()).filter(Boolean);if(names.length<3){$("hint").textContent="أدخل 3 أسماء لاعبين على الأقل.";return}let word=["تفاح","بحر","قهوة","مدرسة","سيارة","مطار"][Math.floor(Math.random()*6)],spy=Math.floor(Math.random()*names.length),n=0;$("setup").classList.add("hidden");$("play").classList.remove("hidden");$("rLabel").textContent="عدد اللاعبين";$("bLabel").textContent="المحتال";$("rScore").textContent=names.length;$("bScore").textContent="1";$("progress").textContent="مرروا الجهاز بالترتيب";function show(){if(n>=names.length){$("question").textContent="ابدؤوا النقاش! من تتوقعون أنه المحتال؟";$("answers").innerHTML="";return}$("question").textContent="مرر الجهاز إلى "+names[n]+" ثم اكشف الدور";$("answers").innerHTML="";let b=document.createElement("button");b.className="btn";b.textContent="اكشف دوري";b.type="button";b.onclick=()=>{b.remove();let d=document.createElement("div");d.className="question";d.textContent=n===spy?"أنت المحتال 🕵️":"الكلمة السرية: "+word;$("answers").appendChild(d);let c=document.createElement("button");c.className="btn secondary";c.textContent="إخفاء وتمرير الجهاز";c.type="button";c.onclick=()=>{n++;show()};$("answers").appendChild(c)};$("answers").appendChild(b)}show();return}
round=shuffle(banks[game]||banks.brain).slice(0,Math.min(Number($("count").value),(banks[game]||banks.brain).length));idx=0;red=0;blue=0;turn=0;$("rLabel").textContent=$("redName").value||"الفريق الأحمر";$("bLabel").textContent=$("blueName").value||"الفريق الأزرق";$("rScore").textContent=0;$("bScore").textContent=0;$("setup").classList.add("hidden");$("play").classList.remove("hidden");render()});
function render(){if(idx>=round.length){$("question").textContent="انتهت الجولة! 🎉";$("progress").textContent="النتيجة النهائية: "+red+" — "+blue;$("answers").innerHTML="";$("next").classList.add("hidden");return}let q=round[idx];$("progress").textContent=`السؤال ${idx+1} من ${round.length} • الدور: ${turn%2===0?$("rLabel").textContent:$("bLabel").textContent}`;$("question").textContent=q[0];$("feedback").textContent="";$("answers").innerHTML="";q[1].forEach((a,i)=>{let b=document.createElement("button");b.type="button";b.className="choice";b.textContent=a;b.onclick=()=>{[...$("answers").children].forEach(x=>x.disabled=true);if(i===q[2]){b.classList.add("correct");if(turn%2===0)red++;else blue++;$("feedback").textContent="إجابة صحيحة! +1 نقطة"}else{b.classList.add("wrong");$("answers").children[q[2]]?.classList.add("correct");$("feedback").textContent="إجابة غير صحيحة"}$("rScore").textContent=red;$("bScore").textContent=blue;$("next").classList.remove("hidden")};$("answers").appendChild(b)});$("next").classList.add("hidden")}
$("next").addEventListener("click",()=>{idx++;turn++;render()});$("restart").addEventListener("click",()=>{$("play").classList.add("hidden");$("setup").classList.remove("hidden");$("next").classList.add("hidden")});
})();
</script></body></html>
